# Cache por tipo de arquivo. Assets do Vite têm hash no nome e podem ficar
# em cache para sempre; todo o resto (index.html, version.json) é revalidado
# a cada acesso, para que um deploy novo chegue sem precisar de F5.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control             $cache_control                     always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://casadiana-api.onrender.com; font-src 'self'; object-src 'none'; frame-ancestors 'none';"
        always;

    # React Router — todas as rotas retornam index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
